name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Gemma 3 1B model (bundled in APK)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is required. Create one at https://huggingface.co/settings/tokens and add it as a GitHub secret."
            exit 1
          fi
          mkdir -p app/src/main/assets/models
          curl -L --fail \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/gemma3-1b-it-int4.task" \
            -o app/src/main/assets/models/gemma3-1b-it-int4.task
          ls -lh app/src/main/assets/models/

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsummary-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
